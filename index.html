<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <h1>To-Do List Life Dashboard</h1>
        <p class="app-subtitle">Your daily productivity hub</p>
    </header>

    <main class="dashboard">
        <section id="greeting" class="dashboard-card"></section>
        <section id="timer" class="dashboard-card"></section>
        <section id="tasks" class="dashboard-card"></section>
        <section id="links" class="dashboard-card"></section>
    </main>

    <script src="js/app.js" defer></script>
</body>
</html>
